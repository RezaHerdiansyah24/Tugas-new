    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(function() {
            const API_KEY = 'c07d254507d74604b84f3ea9c03cae7a';
            const PROXY = "https://api.allorigins.win/get?url=";
            const alertBox = $('#alertBox');
            const newsContainer = $('#dv_content_card');

            function fetchNews(query){
                const URL_FIKS = `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&sortBy=publishedAt&apiKey=${API_KEY}&language=id`;
                $.ajax({
                    url: PROXY + encodeURIComponent(URL_FIKS), 
                    method: 'GET',
                    success: function(proxyResponse) {
                                const data = JSON.parse(proxyResponse.contents); 
                                console.log(data.articles);
                                if (data.status === 'error') {
                                    displayError(data.message);
                                } else if (!data.articles || data.articles.length === 0) {
                                    displayError(`Tidak ada berita yang cocok untuk kata kunci pencarian "${query}".`);
                                } else {
                                    displayNews(data.articles);
                                }
                            },

                    error: function(jqXHR, textStatus, errorThrown) {
                                console.error('AJAX Error:', textStatus, errorThrown);
                                displayError('Gagal mengambil data berita. Silakan coba lagi nanti.');
                            },
                });
            }

            function displayError(message) {
                alertBox.html(`<div class="alert alert-warning text-center">${message}</div>`);
            }

            function displayNews(articles){
                $.each(articles, function(index, article){
                    if (!article.title || !article.description || article.title === "[Removed]") {
                        return true;
                    }

                    const formattedDate = new Date(article.publishedAt).toLocaleDateString('id-ID', { 
                                day: 'numeric', month: 'long', year: 'numeric' 
                            });
                    const imageUrl = article.urlToImage || 'https://via.placeholder.com/400x220.png?text=Gambar+Tidak+Tersedia';

                    const card =
                        `
                        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-4" style="margin-top: 10px; margin-bottom: 10px;">
                            <div class="card rounded-0 p-0 shadow-sm">
                                <img src="${imageUrl}" 
                                    class="card-img-top rounded-0" style="height: 15rem;">
                                <div class="card-body text-center">
                                    <h6 title="${article.description}" class="card-title" style="cursor: pointer;">${article.title.substring(1, 30) + "..."}</h6>
                                    <hr />
                                    <a href="https://github.com/azouaoui-med/angular-pro-sidebar" target="_blank" class="btn btn-danger btn-sm">Hapus</a>
                                    <a href="${article.url}" target="_blank" class="btn btn-success btn-sm">Detail</a>
                                </div>                    
                            </div>
                            
                        </div>
                        `
                    newsContainer.append(card);
                });
            }

            fetchNews('Indonesia Terkini');
        });
    </script>
